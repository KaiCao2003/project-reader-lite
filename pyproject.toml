[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "project-reader-lite"
version = "0.1.0"
description = "Index paths for Basler, Motive, Open Ephys, Kilosort, results, and custom labels."
readme = "README.md"
requires-python = ">=3.10"
dependencies = []

[project.urls]
Repository = "https://github.com/KaiCao2003/project-reader-lite"
Documentation = "https://github.com/KaiCao2003/project-reader-lite#readme"
Issues = "https://github.com/KaiCao2003/project-reader-lite/issues"

[tool.setuptools.packages.find]
include = ["project_reader_lite*"]
